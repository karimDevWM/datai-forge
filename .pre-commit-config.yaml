exclude: >
  (?x)^(
    backend/build/|
    backend/src/.*\.egg-info/|
    docs/docs\.egg-info/|
    backend/(bronze|silver|gold)/|
    backend/data-raw/|
    .*\.parquet$|
    .*\.crc$|
    .*_SUCCESS$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        files: ^(backend/src/|backend/tests/|frontend/src/)
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        files: ^(backend/src/|backend/tests/|frontend/src/)

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        args:
          - "--extra-keys"
          - "metadata.kernelspec metadata.language_info metadata.execution cell.metadata.execution cell.metadata.collapsed cell.metadata.scrolled"
