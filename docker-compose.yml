services:
  # MySQL database service
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .secrets
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}" ]
      timeout: 20s
      retries: 10
      interval: 5s

  # Backend service (ETL, ML, DB Scripts)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - ./:/workspace
    env_file: .secrets
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

  # Frontend service (Dash BI)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "8050:8050"
    env_file: .secrets
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

  # Documentation service (MkDocs)
  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    volumes:
      - ./docs:/app
    ports:
      - "8000:8000"

volumes:
  mysql_data:
